name: Update Jungle Theme Colors

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytz

      - name: Update theme colors
        run: |
          python - <<'EOF'
          import re
          import random
          from datetime import datetime
          import pytz

          et = pytz.timezone('US/Eastern')
          now = datetime.now(et)
          hour = now.hour

          # Each time period has its own unique phrases — no repeats across buckets
          themes = {
              'SUNRISE': {
                  'hours': range(5, 7),
                  'gradient': '0:FF6B35,50:E8A317,100:2D6A4F',
                  'phrases': [
                      "first light through leaves",
                      "the canopy wakes",
                      "gold on wet stone",
                      "mist lifts slowly",
                      "morning finds the ruins",
                      "dew on everything",
                      "the river catches dawn",
                      "warm stone underfoot",
                  ],
              },
              'MORNING': {
                  'hours': range(7, 10),
                  'gradient': '0:40916C,50:52B788,100:95D5B2',
                  'phrases': [
                      "fern and shadow",
                      "the undergrowth hums",
                      "green cathedral",
                      "roots drink deep",
                      "sunlight on moss",
                      "the trail opens",
                      "alive beneath the canopy",
                      "every leaf turns",
                  ],
              },
              'MIDDAY': {
                  'hours': range(10, 13),
                  'gradient': '0:2D6A4F,50:52B788,100:FFD700',
                  'phrases': [
                      "light finds a way",
                      "the canopy glows",
                      "bright water over stone",
                      "heat rises from the path",
                      "sun through the highest leaves",
                      "the river runs clear",
                      "shadows shrink to nothing",
                      "gold pours down",
                  ],
              },
              'LATE_AFTERNOON': {
                  'hours': range(13, 17),
                  'gradient': '0:8B6914,50:D4A017,100:2D6A4F',
                  'phrases': [
                      "amber through leaves",
                      "the long walk back",
                      "deeper in still",
                      "sweat and stone",
                      "thick air heavy green",
                      "the jungle tests all",
                      "slow heat fading",
                      "ancient shade",
                  ],
              },
              'SUNSET': {
                  'hours': range(17, 19),
                  'gradient': '0:FF4500,50:E68A00,100:1B4332',
                  'phrases': [
                      "the river burns gold",
                      "last light on stone",
                      "birds return to roost",
                      "fire through the trees",
                      "the sky lets go",
                      "warm dark coming",
                      "temple silhouette",
                      "everything turns amber",
                  ],
              },
              'DUSK': {
                  'hours': range(19, 21),
                  'gradient': '0:2D6A4F,50:3B5998,100:4B0082',
                  'phrases': [
                      "firefly season",
                      "purple mist settles",
                      "the chorus begins",
                      "night blooms open",
                      "torchlight on vine",
                      "twilight on the steps",
                      "the shift between",
                      "green fades to blue",
                  ],
              },
              'MIDNIGHT': {
                  'hours': range(21, 24),
                  'gradient': '0:0A1F0A,50:1B4332,100:2D6A4F',
                  'phrases': [
                      "the ruins remember",
                      "moonlight on the path",
                      "still water runs",
                      "stone holds warmth",
                      "the old growth knows",
                      "quiet holds everything",
                      "carved by time",
                      "silver on dark green",
                  ],
              },
              'LATE_NIGHT': {
                  'hours': range(0, 3),
                  'gradient': '0:020D02,50:0B3D0B,100:1B4332',
                  'phrases': [
                      "something always watches",
                      "the deepest green",
                      "roots move below",
                      "bioluminescence",
                      "rain on stone",
                      "the long green silence",
                      "eyes in the dark",
                      "moss covers everything",
                  ],
              },
              'EARLY_MORNING': {
                  'hours': range(3, 5),
                  'gradient': '0:1B4332,50:2E4057,100:3B5998',
                  'phrases': [
                      "mist before dawn",
                      "the quietest hour",
                      "blue light on stone",
                      "overgrown path",
                      "slow water",
                      "the canopy breathes",
                      "patience outlasts",
                      "vine over ruin",
                  ],
              },
          }

          # Find current theme
          gradient = '0:1B4332,50:2D6A4F,100:52B788'
          theme_name = 'UNKNOWN'
          phrases = []
          for name, theme in themes.items():
              if hour in theme['hours']:
                  gradient = theme['gradient']
                  theme_name = name
                  phrases = theme['phrases']
                  break

          # Reverse gradient for divider 2
          colors = [p.split(':')[1] for p in gradient.split(',')]
          rev_gradient = f"0:{colors[2]},50:{colors[1]},100:{colors[0]}"

          # Pick 3 random phrases from the bucket
          random.shuffle(phrases)
          selected = phrases[:3]
          typing_lines = ';'.join(p.replace(' ', '+') for p in selected)
          typing_url = (
              "https://readme-typing-svg.herokuapp.com?font=Courier+Prime"
              f"&size=22&duration=3000&pause=1500&color=52B788&center=true"
              f"&vCenter=true&multiline=false&width=500&height=60&lines={typing_lines}"
          )

          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          # Header wave (gradient only, no text)
          header = f'![Header](https://capsule-render.vercel.app/api?type=waving&color={gradient}&height=200&section=header)'
          content = re.sub(
              r'<!-- TIME_THEME_START -->.*?<!-- TIME_THEME_END -->',
              f'<!-- TIME_THEME_START -->\n{header}\n<!-- TIME_THEME_END -->',
              content, flags=re.DOTALL
          )

          # Typing animation (shuffled phrases)
          typing = f'[![Typing SVG]({typing_url})](https://git.io/typing-svg)'
          content = re.sub(
              r'<!-- TYPING_ANIMATION_START -->.*?<!-- TYPING_ANIMATION_END -->',
              f'<!-- TYPING_ANIMATION_START -->\n{typing}\n<!-- TYPING_ANIMATION_END -->',
              content, flags=re.DOTALL
          )

          # Divider 1
          div1 = f'<img width="600" src="https://capsule-render.vercel.app/api?type=rect&color={gradient}&height=2" />'
          content = re.sub(
              r'<!-- DIVIDER_1_START -->.*?<!-- DIVIDER_1_END -->',
              f'<!-- DIVIDER_1_START -->\n{div1}\n<!-- DIVIDER_1_END -->',
              content, flags=re.DOTALL
          )

          # Divider 2 (reversed gradient)
          div2 = f'<img width="600" src="https://capsule-render.vercel.app/api?type=rect&color={rev_gradient}&height=2" />'
          content = re.sub(
              r'<!-- DIVIDER_2_START -->.*?<!-- DIVIDER_2_END -->',
              f'<!-- DIVIDER_2_START -->\n{div2}\n<!-- DIVIDER_2_END -->',
              content, flags=re.DOTALL
          )

          # Divider 3 (short, between social links and tech stack)
          div3 = f'<div align="center">\n<img width="400" src="https://capsule-render.vercel.app/api?type=rect&color={gradient}&height=2" />\n</div>'
          content = re.sub(
              r'<!-- DIVIDER_3_START -->.*?<!-- DIVIDER_3_END -->',
              f'<!-- DIVIDER_3_START -->\n{div3}\n<!-- DIVIDER_3_END -->',
              content, flags=re.DOTALL
          )

          # Footer wave (gradient only, no text)
          footer = f'![Footer](https://capsule-render.vercel.app/api?type=waving&color={gradient}&height=120&section=footer)'
          content = re.sub(
              r'<!-- FOOTER_WAVE_START -->.*?<!-- FOOTER_WAVE_END -->',
              f'<!-- FOOTER_WAVE_START -->\n{footer}\n<!-- FOOTER_WAVE_END -->',
              content, flags=re.DOTALL
          )

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(content)

          print(f"Updated: {theme_name} at {now.strftime('%I:%M %p %Z')}")
          EOF

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --staged --quiet || git commit -m "🌿 Auto-update Jungle theme" && git push
