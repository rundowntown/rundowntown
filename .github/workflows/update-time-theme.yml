name: Update Time-Based Western Theme

on:
  schedule:
    # Runs every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-theme:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Install pytz for timezone support
        run: pip install pytz
          
      - name: Update README with current time theme
        run: |
          python - <<'EOF'
          import re
          from datetime import datetime
          import pytz

          # Get current EST/EDT hour (Eastern Time)
          eastern = pytz.timezone('US/Eastern')
          current_time = datetime.now(eastern)
          current_hour = current_time.hour
          
          # Define all 9 themes
          themes = {
              "SUNRISE": {
                  "hours": range(5, 7),
                  "content": '''### 🌅 SUNRISE (5am - 7am)

          ![Sunrise Banner](https://capsule-render.vercel.app/api?type=waving&color=0:FF69B4,50:FF6347,100:FFD700&height=250&section=header&text=rundowntown&fontSize=90&fontColor=FFFFFF&stroke=8B4513&strokeWidth=2&fontAlignY=45&desc=Code.%20Create.%20Conquer.&descSize=28&descAlignY=65&animation=fadeIn)

          <div align="center">

          ![Time Badge](https://img.shields.io/badge/🌅_SUNRISE-First_Light-FF6347?style=for-the-badge&labelColor=8B4513)
          ![Current Time](https://img.shields.io/badge/⏰_Time-5am--7am-FFD700?style=for-the-badge&labelColor=D2691E)

          ### *First light breaks, another day to ride*

          🌄 Dawn's first glow • 🐓 Rooster's callin' • ⛺ Camp's stirrin' to life

          </div>'''
              },
              "MORNING": {
                  "hours": range(7, 10),
                  "content": '''### ☕ MORNING (7am - 10am)

          ![Morning Banner](https://capsule-render.vercel.app/api?type=waving&color=0:FFA500,50:FFB347,100:FDD835&height=250&section=header&text=rundowntown&fontSize=90&fontColor=FFFFFF&stroke=8B4513&strokeWidth=2&fontAlignY=45&desc=Code.%20Create.%20Conquer.&descSize=28&descAlignY=65&animation=scaleIn)

          <div align="center">

          ![Time Badge](https://img.shields.io/badge/☕_MORNING-Trail_Starts-FFA500?style=for-the-badge&labelColor=8B4513)
          ![Current Time](https://img.shields.io/badge/⏰_Time-7am--10am-FFB347?style=for-the-badge&labelColor=A0522D)

          ### *Coffee's hot, horses saddled, let's ride*

          ☕ Fresh brew ready • 🏜️ Trail's callin' • 🐎 Saddle up time

          </div>'''
              },
              "MIDDAY": {
                  "hours": range(10, 13),
                  "content": '''### ☀️ MIDDAY (10am - 1pm)

          ![Midday Banner](https://capsule-render.vercel.app/api?type=waving&color=0:FFD700,50:FFC107,100:FFEB3B&height=250&section=header&text=rundowntown&fontSize=90&fontColor=8B4513&stroke=000000&strokeWidth=2&fontAlignY=45&desc=Code.%20Create.%20Conquer.&descSize=28&descAlignY=65&animation=scaleIn)

          <div align="center">

          ![Time Badge](https://img.shields.io/badge/☀️_MIDDAY-Sun's_Risin'-FFD700?style=for-the-badge&labelColor=8B4513)
          ![Current Time](https://img.shields.io/badge/⏰_Time-10am--1pm-FFC107?style=for-the-badge&labelColor=654321)

          ### *Sun climbs high, desert heat begins*

          ☀️ Heat's buildin' • 🌵 Wide open plains • 💪 Ridin' strong

          </div>'''
              },
              "LATE_AFTERNOON": {
                  "hours": range(13, 17),
                  "content": '''### 🔥 LATE AFTERNOON (1pm - 5pm)

          ![Late Afternoon Banner](https://capsule-render.vercel.app/api?type=waving&color=0:FF8C00,50:FF7F00,100:DAA520&height=250&section=header&text=rundowntown&fontSize=90&fontColor=FFFFFF&stroke=8B4513&strokeWidth=2&fontAlignY=45&desc=Code.%20Create.%20Conquer.&descSize=28&descAlignY=65&animation=twinkling)

          <div align="center">

          ![Time Badge](https://img.shields.io/badge/🔥_LATE_AFTERNOON-Hottest_Hours-FF8C00?style=for-the-badge&labelColor=8B4513)
          ![Current Time](https://img.shields.io/badge/⏰_Time-1pm--5pm-DAA520?style=for-the-badge&labelColor=654321)

          ### *Draw fast, aim true*

          ☀️ Sun's blazin' overhead • 🌵 Peak heat • ⚡ High stakes

          </div>'''
              },
              "SUNSET": {
                  "hours": range(17, 19),
                  "content": '''### 🌇 EVENING/SUNSET (5pm - 7pm)

          ![Evening Banner](https://capsule-render.vercel.app/api?type=waving&color=0:FF4500,50:FF6347,100:FF8C69&height=250&section=header&text=rundowntown&fontSize=90&fontColor=FFFFFF&stroke=8B4513&strokeWidth=2&fontAlignY=45&desc=Code.%20Create.%20Conquer.&descSize=28&descAlignY=65&animation=fadeIn)

          <div align="center">

          ![Time Badge](https://img.shields.io/badge/🌇_SUNSET-Golden_Hour-FF4500?style=for-the-badge&labelColor=8B4513)
          ![Current Time](https://img.shields.io/badge/⏰_Time-5pm--7pm-FF6347?style=for-the-badge&labelColor=A0522D)

          ### *Sky's burnin' red, another day conquered*

          🌅 Horizon's glowin' • 🐎 Slowin' the pace • 🏜️ Long shadows fall

          </div>'''
              },
              "DUSK": {
                  "hours": range(19, 21),
                  "content": '''### 🌆 DUSK (7pm - 9pm)

          ![Dusk Banner](https://capsule-render.vercel.app/api?type=waving&color=0:8B4513,50:A0522D,100:CD853F&height=250&section=header&text=rundowntown&fontSize=90&fontColor=F5F5DC&stroke=000000&strokeWidth=2&fontAlignY=45&desc=Code.%20Create.%20Conquer.&descSize=28&descAlignY=65&animation=scaleIn)

          <div align="center">

          ![Time Badge](https://img.shields.io/badge/🌆_DUSK-Day's_End-A0522D?style=for-the-badge&labelColor=654321)
          ![Current Time](https://img.shields.io/badge/⏰_Time-7pm--9pm-CD853F?style=for-the-badge&labelColor=8B4513)

          ### *Headin' home before dark*

          🌄 Last light fadin' • 🐎 Stable's in sight • 🏕️ Time to rest

          </div>'''
              },
              "MIDNIGHT": {
                  "hours": range(21, 24),
                  "content": '''### 🌙 MIDNIGHT (9pm - 12am)

          ![Midnight Banner](https://capsule-render.vercel.app/api?type=waving&color=0:1C1C1C,50:2F4F4F,100:696969&height=250&section=header&text=rundowntown&fontSize=90&fontColor=DAA520&stroke=000000&strokeWidth=3&fontAlignY=45&desc=Code.%20Create.%20Conquer.&descSize=28&descAlignY=65&animation=twinkling)

          <div align="center">

          ![Time Badge](https://img.shields.io/badge/🌙_MIDNIGHT-Deep_Night-2F4F4F?style=for-the-badge&labelColor=1C1C1C)
          ![Current Time](https://img.shields.io/badge/⏰_Time-9pm--12am-696969?style=for-the-badge&labelColor=000000)

          ### *The night's dark, but the stars guide true*

          🌙 Moon's high • 🔥 Campfire glowin' • ⭐ Stars light the way

          </div>'''
              },
              "LATE_NIGHT": {
                  "hours": range(0, 3),
                  "content": '''### 🌌 LATE NIGHT (12am - 3am)

          ![Late Night Banner](https://capsule-render.vercel.app/api?type=waving&color=0:000000,50:191970,100:2F4F4F&height=250&section=header&text=rundowntown&fontSize=90&fontColor=FFFFFF&stroke=4169E1&strokeWidth=2&fontAlignY=45&desc=Code.%20Create.%20Conquer.&descSize=28&descAlignY=65&animation=twinkling)

          <div align="center">

          ![Time Badge](https://img.shields.io/badge/🌌_LATE_NIGHT-Dead_of_Night-191970?style=for-the-badge&labelColor=000000)
          ![Current Time](https://img.shields.io/badge/⏰_Time-12am--3am-2F4F4F?style=for-the-badge&labelColor=0C0C0C)

          ### *Only the coyotes and night riders awake*

          🦉 Silence reigns • 🌌 Stars blanket the sky • 🔥 Embers still warm

          </div>'''
              },
              "EARLY_MORNING": {
                  "hours": range(3, 5),
                  "content": '''### 🌃 EARLY MORNING (3am - 5am)

          ![Early Morning Banner](https://capsule-render.vercel.app/api?type=waving&color=0:191970,50:483D8B,100:6A5ACD&height=250&section=header&text=rundowntown&fontSize=90&fontColor=E6E6FA&stroke=000000&strokeWidth=2&fontAlignY=45&desc=Code.%20Create.%20Conquer.&descSize=28&descAlignY=65&animation=fadeIn)

          <div align="center">

          ![Time Badge](https://img.shields.io/badge/🌃_PRE--DAWN-Before_the_Light-483D8B?style=for-the-badge&labelColor=191970)
          ![Current Time](https://img.shields.io/badge/⏰_Time-3am--5am-6A5ACD?style=for-the-badge&labelColor=2F2F4F)

          ### *The quietest hour, dawn's just a promise*

          🌌 Darkness holds strong • ⭐ Last of the night watch • 🌅 Horizon hints at change

          </div>'''
              }
          }
          
          # Determine current theme
          current_theme = None
          for theme_name, theme_data in themes.items():
              if current_hour in theme_data["hours"]:
                  current_theme = theme_data["content"]
                  break
          
          # Read README
          with open('README.md', 'r', encoding='utf-8') as f:
              readme_content = f.read()
          
          # Replace the time theme section
          # Pattern matches from the start marker to the end marker
          pattern = r'<!-- TIME_THEME_START -->.*?<!-- TIME_THEME_END -->'
          
          replacement = f"<!-- TIME_THEME_START -->\n\n{current_theme}\n\n<!-- TIME_THEME_END -->"
          
          updated_content = re.sub(pattern, replacement, readme_content, flags=re.DOTALL)
          
          # Write back to README
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(updated_content)
          
          print(f"✅ Updated theme for hour: {current_hour} EST/EDT ({current_time.strftime('%I:%M %p %Z')})")
          EOF
          
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤠 Auto-update: Western time theme" && git push)

