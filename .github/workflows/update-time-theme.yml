                  "divider": "![Divider](https://capsule-render.vercel.app/api?type=rect&color=0:000000,50:191970,100:2F4F4F&height=3)",
                  "content_template": '''![Late Night Banner](https://capsule-render.vercel.app/api?type=waving&color=0:000000,50:191970,100:2F4F4F&height=250&section=header&text=rundowntown&fontSize=90&fontColor=FFFFFF&stroke=4169E1&strokeWidth=2&fontAlignY=45&desc={tagline}&descSize=28&descAlignY=65&animation=twinkling)

