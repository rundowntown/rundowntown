name: Update Time-Based Western Theme

on:
  schedule:
    # Runs every 2 hours
    - cron: '0 */2 * * *'
  
  workflow_dispatch: # Can also trigger manually

permissions:
  contents: write

jobs:
  update-theme:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Install pytz for timezone support
        run: pip install pytz
          
