                  current_theme_name = theme_name
                  current_theme_data = theme_data
                  break
          
          # Get random tagline for banner
          random_tagline = random.choice(taglines[current_theme_name])
          encoded_tagline = urllib.parse.quote(random_tagline)
          
          # Get ALL typing phrases for this time period and shuffle them
          all_typing_phrases = typing_phrases[current_theme_name].copy()
          random.shuffle(all_typing_phrases)
          encoded_typing = ";".join([urllib.parse.quote(phrase) for phrase in all_typing_phrases])
          
          # Build the typing animation URL with all phrases
          typing_animation = f"[![Typing SVG](https://readme-typing-svg.herokuapp.com?font=Courier+Prime&size=24&duration=3000&pause=1000&color=D2691E&center=true&vCenter=true&multiline=false&width=700&height=100&lines={encoded_typing})](https://git.io/typing-svg)"
          
          # Build the content with the random tagline
          current_theme = current_theme_data["content_template"].format(tagline=encoded_tagline)
          current_footer = current_theme_data["footer"]
          current_divider = current_theme_data["divider"]
          
          # Read README
          with open('README.md', 'r', encoding='utf-8') as f:
              readme_content = f.read()
          
          # Replace the time theme section
          theme_pattern = r'<!-- TIME_THEME_START -->.*?<!-- TIME_THEME_END -->'
          theme_replacement = f"<!-- TIME_THEME_START -->\n\n{current_theme}\n\n<!-- TIME_THEME_END -->"
          updated_content = re.sub(theme_pattern, theme_replacement, readme_content, flags=re.DOTALL)
          
          # Replace the footer wave section
          footer_pattern = r'<!-- FOOTER_WAVE_START -->.*?<!-- FOOTER_WAVE_END -->'
          footer_replacement = f"<!-- FOOTER_WAVE_START -->\n{current_footer}\n<!-- FOOTER_WAVE_END -->"
          updated_content = re.sub(footer_pattern, footer_replacement, updated_content, flags=re.DOTALL)
          
          # Replace the typing animation section
          typing_pattern = r'<!-- TYPING_ANIMATION_START -->.*?<!-- TYPING_ANIMATION_END -->'
          typing_replacement = f"<!-- TYPING_ANIMATION_START -->\n{typing_animation}\n<!-- TYPING_ANIMATION_END -->"
          updated_content = re.sub(typing_pattern, typing_replacement, updated_content, flags=re.DOTALL)
          
          # For divider 2, reverse the gradient direction
          # Extract colors from current divider and reverse them
          import re as regex
          color_match = regex.search(r'color=0:([A-F0-9]+),50:([A-F0-9]+),100:([A-F0-9]+)', current_divider)
          if color_match:
              color1, color2, color3 = color_match.groups()
              # Reverse the gradient
              divider2 = current_divider.replace(f'color=0:{color1},50:{color2},100:{color3}', f'color=0:{color3},50:{color2},100:{color1}')
          else:
              divider2 = current_divider
          
          # Replace divider 1 (top)
          divider1_pattern = r'<!-- DIVIDER_1_START -->.*?<!-- DIVIDER_1_END -->'
          divider1_replacement = f"<!-- DIVIDER_1_START -->\n{current_divider}\n<!-- DIVIDER_1_END -->"
          updated_content = re.sub(divider1_pattern, divider1_replacement, updated_content, flags=re.DOTALL)
          
          # Replace divider 2 (bottom - complementary/reversed)
          divider2_pattern = r'<!-- DIVIDER_2_START -->.*?<!-- DIVIDER_2_END -->'
          divider2_replacement = f"<!-- DIVIDER_2_START -->\n{divider2}\n<!-- DIVIDER_2_END -->"
          updated_content = re.sub(divider2_pattern, divider2_replacement, updated_content, flags=re.DOTALL)
          
          # Replace divider 3 (short divider between stats and tech) - make it constrained width
          # Extract just the color part from current_divider and create short version
          color_match_div3 = regex.search(r'color=([^&]+)', current_divider)
          if color_match_div3:
              color_value = color_match_div3.group(1)
              divider3_short = f'<div align="center">\n<img width="400" src="https://capsule-render.vercel.app/api?type=rect&color={color_value}&height=2" />\n</div>'
          else:
              divider3_short = '<div align="center">\n<img width="400" src="https://capsule-render.vercel.app/api?type=rect&color=0:8B4513,50:D2691E,100:DEB887&height=2" />\n</div>'
          
          divider3_pattern = r'<!-- DIVIDER_3_START -->.*?<!-- DIVIDER_3_END -->'
          divider3_replacement = f"<!-- DIVIDER_3_START -->\n{divider3_short}\n<!-- DIVIDER_3_END -->"
          updated_content = re.sub(divider3_pattern, divider3_replacement, updated_content, flags=re.DOTALL)
          
          # Write back to README
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(updated_content)
          
          print(f"✅ Updated theme: {current_theme_name} at {current_time.strftime('%I:%M %p %Z')}")
          print(f"🎲 Random banner tagline: '{random_tagline}'")
          print(f"⌨️  Typing phrases (shuffled): {len(all_typing_phrases)} total")
          EOF
          
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤠 Auto-update Western theme" && git push)

