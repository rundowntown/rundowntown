name: Update Time-Based Banner

on:
  schedule:
    # Run every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-banner:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pillow pytz requests
      
      - name: Generate time-based banner
        run: |
          python generate_time_banner.py
      
      - name: Update README with new banner
        run: |
          # Replace the banner line in README.md
          # This will update line that contains the banner image
          
          # For now, just commit the new banner image
          echo "Banner generated!"
      
      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add current_banner.jpg
          git diff --quiet && git diff --staged --quiet || (git commit -m "🌅 Auto-update banner for $(date +%Y-%m-%d\ %H:%M)" && git push)

